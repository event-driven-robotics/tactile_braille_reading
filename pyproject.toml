[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tactile_braille_reading"
version = "1.0.0"
description = "Tactile Braille Reading"
readme = "README.md"
license = ""
authors = [
    { name = "Simon F Muller-Cleve" }
]
requires-python = ">=3.11"

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "setuptools (==81.0.0)"
]
